[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ribotxalign"
version = "0.1.0"
description = "Long-read-guided mapping and EM redistribution of Ribo-seq reads"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Hiroki Ueda"}
]
dependencies = [
  "click>=8.1",
  "mappy>=2.28",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pysam>=0.22"
]

[project.scripts]
ribotxalign = "RiboTxAlign_Cmd:cli"

[tool.setuptools]
py-modules = ["RiboTxAlign_Cmd"]

[tool.setuptools.packages.find]
where = ["."]
include = ["db_construct*", "mapping*", "re_distribute*"]
namespaces = true

[project.urls]
Homepage = "https://github.com/uedaLabR/RiboTxAlign"
Repository = "https://github.com/uedaLabR/RiboTxAlign.git"
Issues = "https://github.com/uedaLabR/RiboTxAlign/issues"
